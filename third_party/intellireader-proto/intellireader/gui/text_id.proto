syntax = "proto2";

package gui.text_id;

// Identifier of the text generated by the reader
enum TextId {
    // IP-address of Ethernet or WiFi interface of the reader
    IP_ADDRESS = 0;

    // Link status (Up/Down) of the first Ethernet port
    ETHERNET_PORT1_STATUS = 1;

    // Link status (Up/Down) of the second Ethernet port
    ETHERNET_PORT2_STATUS = 2;

    // IntelliReader firmware version
    FIRMWARE_VERSION = 3;

    // Reader serial number
    SERIAL_NUMBER = 4;

    // Reader uptime
    UPTIME = 5;

    // Time elapsed from (what's applicable):
    // * reader startup
    // * last TCP connection was closed
    // * last command received from RS232/USB
    DOWNTIME = 6;

    // RS232 (UART) baudrate
    BAUDRATE = 7;

    // Common config checksum (or 'none')
    COMMON_CONFIG_CHECKSUM = 8;

    // EMV config checksum (or 'none')
    EMV_CONFIG_CHECKSUM = 9;
}
