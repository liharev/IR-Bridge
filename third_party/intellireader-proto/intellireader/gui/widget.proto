syntax = "proto2";

package gui.widget;

import "gui/alignment.proto";
import "gui/background.proto";
import "gui/border.proto";
import "gui/font.proto";
import "gui/foreground.proto";
import "gui/picture_id.proto";
import "gui/text_id.proto";
import "gui/qr_code.proto";

// Screen widget
message Widget {
    oneof widget {
        VerticalLayout vertical_layout = 1;
        HorizontalLayout horizontal_layout = 2;
        Text text = 3;
        Picture picture = 4;
        QrCode qr_code = 5;
        CustomerPicture customer_picture = 6;
        GeneratedText generated_text = 7;
    }
}

// Widgets container that places one widget above the other
message VerticalLayout {
    // Widgets within layout
    repeated Widget widgets = 1;
}

// Widgets container that places one widget right to the other
message HorizontalLayout {
    // Widgets within layout
    repeated Widget widgets = 1;
}

// Widget contains user-defined text
message Text {
    // The text to show
    required string text = 1;

    // How to vertically align the text
    optional gui.alignment.VerticalAlignment vertical_alignment = 2 [default = CENTER_VERTICALLY];

    // How to horizontally align the text
    optional gui.alignment.HorizontalAlignment horizontal_alignment = 3 [default = CENTER_HORIZONTALLY];

    // Widget background, use root widget background by default
    optional gui.background.Background background = 4;

    // Widget foreground color, use root widget foreground by default
    optional gui.foreground.Foreground foreground = 5;

    // Font for rendering text
    optional gui.font.Font font = 6 [default = REGULAR_FONT];

    // Makes widget "pressable" and assign ID to distinguish it
    optional uint32 button_id = 7;

    // Optional border around the Text widget
    optional gui.border.Border border = 8;
}

// Widget contains built-in picture
message Picture {
    // The picture ID to show
    required gui.picture_id.PictureId picture_id = 1;

    // How to vertically align the picture
    optional gui.alignment.VerticalAlignment vertical_alignment = 2 [default = CENTER_VERTICALLY];

    // How to horizontally align the picture
    optional gui.alignment.HorizontalAlignment horizontal_alignment = 3 [default = CENTER_HORIZONTALLY];

    // Widget background, use root widget background by default
    optional gui.background.Background background = 4;

    // Makes widget "pressable" and assign ID to distinguish it
    optional uint32 button_id = 5;
}

// Widget contains QR code for some text
message QrCode {
    // Text to generate QR code
    required bytes text = 1;

    // Fixed module (dot) dimension in pixels
    optional uint32 module_dimension = 2;

    // How to vertically align the QR-code
    optional gui.alignment.VerticalAlignment vertical_alignment = 3 [default = CENTER_VERTICALLY];

    // How to horizontally align the QR-code
    optional gui.alignment.HorizontalAlignment horizontal_alignment = 4 [default = CENTER_HORIZONTALLY];

    // QR-code background, black by default
    optional gui.background.Background background = 5;

    // QR-code foreground, white by default
    optional gui.foreground.Foreground foreground = 6;

    // QR-code error correction level (ECC)
    optional gui.qr_code.ErrorCorrectionLevel error_correction_level = 7 [default = QRCODE_ECC_LOW];

    // QR-code Quiet Zone size in the modules (dots)
    optional uint32 quiet_zone_size = 8 [default = 4];
}

// Widget contains customer picture
message CustomerPicture {
    // The customer picture name to show
    required string name = 1;

    // How to vertically align the picture
    optional gui.alignment.VerticalAlignment vertical_alignment = 2 [default = CENTER_VERTICALLY];

    // How to horizontally align the picture
    optional gui.alignment.HorizontalAlignment horizontal_alignment = 3 [default = CENTER_HORIZONTALLY];

    // Widget background, use root widget background by default
    optional gui.background.Background background = 4;

    // Makes widget "pressable" and assign ID to distinguish it
    optional uint32 button_id = 5;
}

// Widget contains text generated by the reader by the Text ID
message GeneratedText {
    // The text ID to show
    required gui.text_id.TextId text_id = 1;

    // Optional prefix before generated text
    optional string prefix = 2 [default = ""];

    // How to vertically align the text
    optional gui.alignment.VerticalAlignment vertical_alignment = 3 [default = CENTER_VERTICALLY];

    // How to horizontally align the text
    optional gui.alignment.HorizontalAlignment horizontal_alignment = 4 [default = CENTER_HORIZONTALLY];

    // Widget background, use root widget background by default
    optional gui.background.Background background = 5;

    // Widget foreground color, use root widget foreground by default
    optional gui.foreground.Foreground foreground = 6;

    // Font for rendering text
    optional gui.font.Font font = 7 [default = REGULAR_FONT];

    // Makes widget "pressable" and assign ID to distinguish it
    optional uint32 button_id = 8;
}
