syntax = "proto2";

import "pinpad/secret.proto";

package pinpad.list_secrets;

message ListSecrets {
}

message SecretsInfo {
    // List of secrets injected to the secure storage
    repeated SecretInfo secret_info = 1;
}

message SecretInfo {
    // Index in the secure storage associated with a secret
    required uint32 index = 1;

    // Attributes assigned to the secret
    required pinpad.secret.SecretAttributes secret_attributes = 2;
}
