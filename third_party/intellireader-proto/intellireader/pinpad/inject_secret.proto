syntax = "proto2";

import "pinpad/secret.proto";

package pinpad.inject_secret;

message PrepareInjection {
}

message DeviceAttributes {
    // 8 random bytes generated by a device
    required bytes unpredictable_number = 1;

    // List of PEM-encoded X.509 certificates:
    // Unique (per device) certificate, Manufacture CA certificate
    required bytes certificates = 2;
}

message InjectionData {
    // Index in the secure storage associated with a secret
    required uint32 index = 1;

    // The `unpredictable_number` field from DeviceAttributes
    required bytes unpredictable_number = 2;

    // Secret to be injected
    required pinpad.secret.Secret secret = 3;
}

message InjectSecret {
    // Protobuf encoded InjectionData message encrypted with device's public key
    required bytes encrypted_injection_data = 1;
}

message InjectResult {
    // Injection status
    required InjectStatus inject_status = 1;
}

enum InjectStatus {
    UNKNOWN_STATUS = 0;
    INJECT_SUCCESS = 1;
}
