syntax = "proto2";

import "pinpad/key_algo.proto";
import "pinpad/key_method.proto";
import "pinpad/key_usage.proto";

package pinpad.secret;

message Secret {
    // Value of the secret
    required bytes value = 1;

    // Attributes assigned to the secret
    required SecretAttributes attributes = 2;
}

message SecretAttributes {
    // Target usage allowed for the secret
    required pinpad.key_usage.Usage usage = 1;

    // Algorithm that allowed to use with the secret
    required pinpad.key_algo.Algorithm algorithm = 2;

    // A tag with arbitrary value associated with the secret value
    required uint32 tag = 3;

    oneof method {
        // Fixed key method
        pinpad.key_method.FixedKey fixed_key = 4;

        // Master/session key method
        pinpad.key_method.MasterSession master_session = 5;

        // Derived unique key per transaction (DUKPT) method
        pinpad.key_method.Dukpt dukpt = 6;

    }
}
