syntax = "proto2";

import "mifare/av2/args.proto";

package mifare.ultralight.password;

// Mifare Ultralight EV1 password based Authentication using clear key
message ClearPassword {
    // Value of the Password (4 bytes)
    required bytes password = 1;
}

// Mifare Ultralight EV1 password based Authentication using NXP SAM AV3 module
message SamPassword {
    // Specifies SAM AV3 arguments that will be used in authentication
    required mifare.av2.args.AuthenticationArguments av3_args = 1;

    // Input value to the Key Diversification Algorithm if required
    optional bytes diversification_input = 2;
}

// Password successfully acknowledged
message PasswordAcknowledge {
    // Password acknowledged value (2 bytes)
    required bytes password_ack = 1;
}
