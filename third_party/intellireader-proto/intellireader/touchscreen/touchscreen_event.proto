syntax = "proto2";

package touchscreen.event;

import "touchscreen/coordinates.proto";
import "touchscreen/widget.proto";

// Event occured on the touchscreen
message TouchscreenEvent {
    oneof event {
        // GUI widget has been pressed
        touchscreen.widget.WidgetId widget_id = 1;

        // (x,y) coordinates on the touchscreen
        touchscreen.coordinates.Coordinates coordinates = 2;
    }
}
